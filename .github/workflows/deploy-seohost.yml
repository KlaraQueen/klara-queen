# Buduje React (npm run build) i wgrywa folder `build` na SEOHOST przez FTP.
# Działa, bo sam GitHub nie zawiera `/build` — ten folder jest w .gitignore.

name: Deploy to SEOHOST (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and build
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
        run: |
          # npm ci wymaga package-lock.json na GitHubie i pełnej zgodności z package.json.
          # npm install działa też przy lekko rozjechanym locku (typowy problem przy pierwszym CI).
          npm install --no-audit --no-fund
          npm run build

      - name: Upload to hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          # Jeśli po połączeniu FTP widzisz od razu zawartość public_html — zmień na: server-dir: ./
          server-dir: ./public_html/
          protocol: ftp
          port: 21
